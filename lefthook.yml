assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: lint-core
      glob: 'packages/core/**/*.{js,ts,tsx}'
      run: pnpm exec eslint --fix {staged_files} && pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: lint-cli
      glob: 'packages/cli/**/*.{js,ts}'
      run: pnpm --dir packages/cli run type && pnpm exec eslint --fix {staged_files} && pnpm exec prettier --write {staged_files}
      stage_fixed: true

    # - name: lint-newdocs
    #   glob: 'packages/newdocs/**/*.{js,jsx,ts,tsx}'
    #   run: pnpm --dir packages/newdocs run type && pnpm exec eslint --fix {staged_files} && pnpm exec prettier --write {staged_files}
    #   stage_fixed: true

    - name: core-checks
      run: |
        if git diff --quiet HEAD -- packages/core; then
          echo "No changes in packages/core. Skipping build."
          exit 0
        fi

        echo "Running tests for packages/core..."
        pnpm --dir packages/core exec vitest run

        echo "Running build:js..."
        pnpm core:build:js

        git add packages/core/src/bundle
        git add packages/cli/src/registry
        echo "Built files added to git."

commit-msg:
  jobs:
    - name: branch-prefix
      run: bash node_modules/@siberiacancode/lefthook/dist/hooks/commit-msg.sh {1}
