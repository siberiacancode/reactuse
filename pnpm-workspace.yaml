packages:
  - 'packages/*'
publicHoistPattern:
  - eslint
  - prettier
  - lefthook
  - vitest
minimumReleaseAgeExclude:
  - '@siberiacancode/reactuse'
  - '@siberiacancode/vitest'
  - '@siberiacancode/eslint'
  - '@siberiacancode/prettier'
  - '@webcam/react'
allowBuilds:
  core-js: true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true
