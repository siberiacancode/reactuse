packages:
  - 'packages/*'
publicHoistPattern:
  - eslint
  - prettier
  - lefthook
  - vitest
minimumReleaseAgeExclude:
  - '@siberiacancode/reactuse'
  - '@siberiacancode/vitest'
  - '@siberiacancode/eslint'
  - '@siberiacancode/prettier'
  - '@webcam/react'
  - fumadocs-core@16.18.3
  - fumadocs-mdx@15.5.3
  - fumadocs-ui@16.18.3
allowBuilds:
  core-js: true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true
